# Cloudflare Workers config: the site deploys as a Worker that serves only static assets.
# `npx wrangler deploy` (the Workers Builds default deploy command) runs [build] first, so the
# Cloudflare project needs no build command of its own.
name = "halo-recipes"
compatibility_date = "2025-06-01"

[build]
command = "npm run build"

[assets]
directory = "./dist"
